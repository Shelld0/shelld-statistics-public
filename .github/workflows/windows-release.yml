name: Windows Installer (No Node/Python for users)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout clean Public Beta source
        uses: actions/checkout@v4
      - name: Node.js for BUILD SERVER ONLY
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python for BUILD SERVER ONLY
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install Electron builder dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Run JavaScript tests
        shell: pwsh
        run: npm test
      - name: Run Python integration tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_*.py'
      # npm run dist builds an x64 PyInstaller MT5 bridge, verifies it starts,
      # bundles it in Electron resources, and creates the NSIS installer.
      - name: Build self-contained Windows installer
        shell: pwsh
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify EXE and create SHA256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $exe -or $exe.Length -lt 1000000) { throw 'Installer was not created correctly' }
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash
          "$hash  $($exe.Name)" | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "SHA256: $hash"
      - name: Upload installer for pre-release testing
        uses: actions/upload-artifact@v4
        with:
          name: Shelld-Statistics-Public-Beta-Windows-Setup
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged beta release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
