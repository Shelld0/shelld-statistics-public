name: Windows Installer (Public Beta)
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Node.js for build only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python for build only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript tests
        run: npm test
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build Windows EXE
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify binary and checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $exe -or $exe.Length -lt 1000000) { throw 'Setup EXE was not created' }
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash
          "$hash  $($exe.Name)" | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shelld-Statistics-Public-Beta-v1.0.4-Setup
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish public beta release
        # Only publish from main (or an explicitly tagged build) after all checks succeed.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4-beta
          target_commitish: ${{ github.sha }}
          name: Shelld Statistics v1.0.4 — Public Beta
          prerelease: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
