<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../src/image-workspace.css"><style>
body{background:#0b0d11;color:#e6e8ef;font-family:Arial;padding:22px} .modal-backdrop{display:none;position:fixed;inset:0;background:#000b;z-index:500;align-items:center;justify-content:center}.modal-backdrop.open{display:flex}.modal{background:#111318;color:#fff;padding:24px;border:1px solid #333;border-radius:18px}.modal-head{display:flex;justify-content:space-between}.primary,.secondary{color:#fff;background:#292e39;border:1px solid #565962;border-radius:8px;padding:8px}.modal-actions{display:flex;gap:10px;justify-content:end}.result-gallery-grid{display:flex;gap:16px}.result-gallery-tile{width:230px;border:1px solid #333;border-radius:12px;padding:12px;background:#1a1e25}.result-gallery-tile img{width:100%;height:130px;object-fit:contain}.result-gallery-tile-footer{margin-top:10px}.hidden{display:none}</style></head><body>

 <div class="result-gallery-tile"><img src="chart-demo.png"><div class="result-gallery-tile-footer"><span>№ 1</span><button data-result-id="1">×</button></div></div>
 <div class="result-gallery-tile"><img src="chart-demo.png"><div class="result-gallery-tile-footer"><span>№ 2</span><button data-result-id="2">×</button></div></div>

const orderLog=[],copyLog=[];
